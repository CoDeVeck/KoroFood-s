spring.application.name=userService

server.port = 8081

#PARA LOCAL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_user_service
spring.datasource.username=postgres
spring.datasource.password=postgre

#PARA PRODUCCION
#spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Variblaes de entorno para GitHub
github.clientI = {GITHUB_CLIENT_ID}
github.clientSecret = {GITHUB_CLIENT_SECRET}

#Variblaes de entorno para Cloudinary
cloudinary.name = {CLOUDINARY_NAME}
cloudinary.key = {CLOUDINARY_KEY_KOROFOODS}
cloudinary.secret = {CLOUDINARY_SECRET_KOROFOODS}

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB